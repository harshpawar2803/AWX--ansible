---
- name: Linux Server Health Check
  hosts: terraform
  become: true

  tasks:

    - name: Check hostname
      ansible.builtin.command: hostname
      register: hostname_output
      changed_when: false

    - name: Check uptime
      ansible.builtin.command: uptime
      register: uptime_output
      changed_when: false

    - name: Check memory
      ansible.builtin.command: free -h
      register: memory_output
      changed_when: false

    - name: Check disk usage
      ansible.builtin.command: df -h
      register: disk_output
      changed_when: false

    - name: Check SSH service
      ansible.builtin.systemd:
        name: sshd
        state: started
      register: ssh_status

    - name: Display health report
      ansible.builtin.debug:
        msg:
          - "===== LINUX SERVER HEALTH REPORT ====="
          - "Hostname: {{ hostname_output.stdout }}"
          - "Uptime: {{ uptime_output.stdout }}"
          - "Memory:"
          - "{{ memory_output.stdout }}"
          - "Disk:"
          - "{{ disk_output.stdout }}"
          - "SSH Service: {{ ssh_status.status.ActiveState }}"